name: Build & Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: MVZ2ModManager
  WAILS3_VERSION: v3.0.0-beta.33

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            asset: MVZ2ModManager-linux-amd64
            bin: MVZ2ModManager
          - os: windows-latest
            platform: windows
            asset: MVZ2ModManager-windows-amd64.exe
            bin: MVZ2ModManager.exe
          - os: macos-latest
            platform: macos
            asset: MVZ2ModManager-macos-arm64.zip
            bin: MVZ2ModManager.app

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        run: wails3 build

      - name: Collect artifacts
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "bin/${{ matrix.bin }}" "${{ matrix.asset }}"
          else
            mv "bin/${{ matrix.bin }}" "${{ matrix.asset }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    needs: build
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-*
          merge-multiple: true
          path: dist

      - name: Fix permissions
        run: |
          f="dist/${{ env.APP_NAME }}-linux-amd64"
          if [ -f "$f" ]; then chmod +x "$f"; fi

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
