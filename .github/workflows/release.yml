name: Build & Release

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: MVZ2ModManager
  WAILS3_VERSION: v3.0.0-beta.33

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_suffix: linux-amd64
            bin: MVZ2ModManager
          - os: windows-latest
            asset_suffix: windows-amd64
            bin: MVZ2ModManager.exe
          - os: macos-latest
            asset_suffix: macos-arm64 # macos-latest 是 arm64 runner
            bin: MVZ2ModManager.app # macOS 产物是 bundle

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config \
            libgtk-4-dev libwebkitgtk-6.0-dev

      - name: Install wails3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS3_VERSION }}

      - name: Install frontend deps
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Build
        run: wails3 build

      - name: Collect artifacts
        shell: bash
        run: |
          ARTIFACT="${APP_NAME}-${{ matrix.asset_suffix }}"
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent \
              "bin/${{ matrix.bin }}" "${ARTIFACT}.zip"
          else
            mv "bin/${{ matrix.bin }}" "${ARTIFACT}"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.asset_suffix }}
          path: ${{ env.APP_NAME }}-${{ matrix.asset_suffix }}*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ env.APP_NAME }}-*
          merge-multiple: true
          path: dist

      - name: Fix permissions
        run: chmod +x dist/${{ env.APP_NAME }}-linux-amd64

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/**
